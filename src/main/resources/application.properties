spring.application.name=excel-module


spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/excel-db?useUnicode=yes&characterEncoding=UTF-8&useSSL=false&serverTimezone=GMT%2B8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# Spring Data JPA
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Database SQL Initialization
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:sql/material_bom_test_data.sql
spring.sql.init.encoding=UTF-8

# SpringDoc OpenAPI & Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# =============================================================================
# Excel Engine Configuration (FAST_EXCEL / APACHE_POI)
# FAST_EXCEL: 高效能、常數級超低記憶體開銷大數據串流引擎 (預設)
# APACHE_POI : 支援進階樣式、複雜合併儲存格、全格式支援之 Apache POI (SXSSF/SAX) 引擎
# =============================================================================
excel.engine=FAST_EXCEL

# =============================================================================
# Excel Task Tracking & Storage Configuration
# excel.task.enabled: 是否啟用長任務宣告式追蹤與資料庫記錄 (預設 true)
# 若設為 false，則 @TrackExcelTask 切面不生效/直接放行，不建立任務記錄、不落盤、不更新進度
# excel.task.storage-dir: 長任務產出檔案本機磁碟暫存目錄 (供 GET /api/v1/excel/tasks/{taskId}/download 下載)
# =============================================================================
excel.task.enabled=true
excel.task.storage-dir=temp/excel-tasks


