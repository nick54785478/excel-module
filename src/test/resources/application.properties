# Test In-Memory Database (H2 with MySQL mode)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Spring Data JPA
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Database SQL Initialization
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:sql/material_bom_test_data.sql
spring.sql.init.encoding=UTF-8

# Excel Engine Configuration (FAST_EXCEL / APACHE_POI)
excel.engine=FAST_EXCEL


